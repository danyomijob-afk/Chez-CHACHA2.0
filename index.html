<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b4fb3">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>CHEZ CHACHA</title>
<style>
:root{--bg:#f3f7fd;--card:#fff;--tx:#0f1f3a;--mu:#5b6b85;--bl:#0b4fb3;--bl2:#e4eeff;--ok:#12805c;--ko:#c0392b;--bd:#d5e0f2}
@media(prefers-color-scheme:dark){:root{--bg:#0c1424;--card:#142038;--tx:#e8eefb;--mu:#93a4c4;--bl:#5c9bff;--bl2:#1b2e52;--ok:#3ec79a;--ko:#ff7b6b;--bd:#27395c}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
header{background:var(--bl);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:20px;letter-spacing:.5px}#st{font-size:12px;opacity:.9;text-align:right}
main{max-width:760px;margin:auto;padding:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.it{background:var(--bl2);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:left;color:var(--tx);font:inherit;cursor:pointer}
.it span{display:block;color:var(--bl);font-weight:700;font-size:14px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0}
button.b{background:var(--bl);color:#fff;border:0;border-radius:8px;padding:12px 16px;font:inherit;font-weight:600;width:100%;margin-top:6px}
button.s{background:var(--bl2);color:var(--bl);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font:inherit}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.r:last-child{border:0}.mu{color:var(--mu);font-size:13px}.big{font-size:26px;font-weight:800;color:var(--bl)}
.x>span:first-child{text-decoration:line-through;opacity:.55}
.p{display:flex;gap:8px}.p button{flex:1}.p .on{background:var(--bl);color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:14px 2px;font:inherit;font-size:13px}nav .on{color:var(--bl);font-weight:700;box-shadow:inset 0 3px var(--bl)}
.er{color:var(--ko);font-size:14px}.ok{color:var(--ok);font-size:14px}
</style></head><body>
<header><b>CHEZ CHACHA</b><span id="st"></span></header>
<main id="m"></main><nav id="nv"></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let warn="";
const LS={g:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){warn="Mémoire de l’appareil pleine : les dernières ventes risquent de ne pas être gardées. Synchronisez dès que possible."}}};
const uid=()=>crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=="x"?r:r&3|8).toString(16)});
const DR=[["Vodka",10000],["Grand",8500],["Red la Belle",10000],["Amarula",6000],["VAT",6500],["Beaufort",600],["33",600],["Jin Tonic",600],["Heineken",500],["Black",600],["Ngo’k",700],["Primus",700],["Racine",600],["Sangria",500],["Château de France",500],["Jus",600],["Booster rouge",600],["Cuca",500],["Eka",500],["Vody",800],["3X",500],["Savana",1500],["Petite Castel",400],["Grosse Castel",700],["Desperado",1500],["Holandia",1000],["Eau petit format",250],["Eau grand format",500],["Guinness",600],["Bavaria",800],["Vin rouge et blanc (Ch Valac)",7000],["Vin rouge et blanc (Montmeyrac)",5000]];
const SET=["menu","sellers","pin"];
let cfg=LS.g("cc2_cfg",null),ses=LS.g("cc2_ses",null),ev=LS.g("cc2_ev",[]),dev=LS.g("cc2_dev",null),seller=LS.g("cc2_sel",""),adm=0,cart={},IT={},tab="caisse",pay="Espèces",day=null,err="",syncing=false;
if(!dev){dev=uid();LS.s("cc2_dev",dev)}
// La journée change à 5 h du matin : un service qui dépasse minuit reste sur la même journée.
const today=()=>new Date(Date.now()-5*36e5).toLocaleDateString("sv"),fmt=n=>Math.round(n).toLocaleString("fr-FR")+" FCFA",save=()=>LS.s("cc2_ev",ev);
const stat=()=>{const e=$("#st");if(!e)return;const n=ev.filter(x=>!x.ok).length;e.textContent=(navigator.onLine?(syncing?"Synchronisation…":n?"":"Synchronisé"):"Hors ligne")+(n?(navigator.onLine&&!syncing?"":" · ")+n+" en attente":"")};
async function auth(body,grant){const r=await fetch(cfg.url+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:cfg.key,"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||j.message||j.error||("Erreur "+r.status));ses={at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000,uid:j.user.id};LS.s("cc2_ses",ses)}
async function api(p,o={}){if(Date.now()>ses.exp-60000)await auth({refresh_token:ses.rt},"refresh_token");const r=await fetch(cfg.url+p,{...o,headers:{apikey:cfg.key,Authorization:"Bearer "+ses.at,"Content-Type":"application/json",...(o.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.status==204?null:r.json()}
async function sync(){if(!ses||syncing||!navigator.onLine){stat();return}syncing=true;stat();
try{const u=ev.filter(e=>!e.ok);if(u.length){await api("/rest/v1/chacha_events?on_conflict=id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(u.map(e=>({id:e.id,user_id:ses.uid,device_id:dev,type:e.type,data:e.data,day:e.day,created_at:e.at})))});u.forEach(e=>e.ok=1)}
// Téléchargement par pages de 1000, sur les 31 derniers jours + les réglages (boissons, vendeurs, code)
const from=new Date(Date.now()-31*864e5).toLocaleDateString("sv");let r=[];
for(let o=0;;o+=1000){const p=await api(`/rest/v1/chacha_events?select=*&or=(day.gte.${from},type.in.(${SET}))&order=created_at.asc,id.asc&limit=1000&offset=${o}`);r=r.concat(p);if(p.length<1000)break}
const m=new Map(ev.map(e=>[e.id,e])),n0=m.size,nm=r.some(x=>x.type=="menu"&&!m.has(x.id));
r.forEach(x=>{if(!m.has(x.id))m.set(x.id,{id:x.id,type:x.type,data:x.data,day:x.day,at:x.created_at,ok:1})});
ev=[...m.values()].filter(e=>!e.ok||e.day>=from||SET.includes(e.type));save();syncing=false;if(nm)cart={};stat();
if(m.size!=n0&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()}catch(e){syncing=false;stat();const s=$("#st");if(s)s.textContent="Erreur de synchronisation"}}
function add(type,data){ev.push({id:uid(),type,data,day:today(),at:new Date().toISOString()});save();sync()}
const last=t=>ev.filter(e=>e.type==t).sort((a,b)=>a.at<b.at?-1:1).pop(),drinks=()=>(last("menu")||{data:{l:DR}}).data.l,sellers=()=>(last("sellers")||{data:{l:[]}}).data.l,pinH=()=>(last("pin")||{data:{}}).data.h;
const vd=()=>new Set(ev.filter(e=>e.type=="void").map(e=>e.data.t)),live=(t,d)=>{const v=vd();return ev.filter(e=>e.type==t&&e.day==d&&!v.has(e.id)&&!e.data.off)},sales=d=>ev.filter(e=>e.type=="sale"&&e.day==d);
function tot(d){let b=0,p=0,es=0,mm=0,V={};const v=vd(),s=sales(d).filter(x=>!v.has(x.id));s.forEach(x=>{x.data.i.forEach(l=>{l.k=="b"?b+=l.p*l.q:p+=l.p*l.q});x.data.m=="Espèces"?es+=x.data.t:mm+=x.data.t;const w=x.data.v||"?";V[w]=(V[w]||0)+x.data.t});const dp=live("expense",d).reduce((a,x)=>a+x.data.a,0);return{b,p,es,mm,n:s.length,dp,rec:es+mm,sol:es+mm-dp,V}}
function render(){const m=$("#m"),nv=$("#nv");nv.innerHTML="";
if(!cfg){m.innerHTML=`<div class="c"><h2>Connexion au serveur</h2><p class="mu">Collez les deux valeurs de Supabase : Project Settings → API.</p><input id="u" placeholder="Project URL (https://…supabase.co)"><input id="k" placeholder="Clé anon / public"><button class="b" onclick="setCfg()">Enregistrer</button><p class="er">${esc(err)}</p></div>`;return}
if(!ses){m.innerHTML=`<div class="c"><h2>Connexion de l’appareil</h2><input id="e" type="email" placeholder="E-mail" autocomplete="username"><input id="w" type="password" placeholder="Mot de passe" autocomplete="current-password"><button class="b" onclick="login()">Se connecter</button><button class="s" style="margin-top:8px;width:100%" onclick="resetCfg()">Changer le serveur</button><p class="er">${esc(err)}</p></div>`;return}
const T=[["caisse","Caisse"],["plats","Plats"],["dep","Dépenses"],["bilan","Bilan"],["admin","Admin"]];nv.innerHTML=T.map(t=>`<button class="${tab==t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("");
({caisse:vCaisse,plats:vPlats,dep:vDep,bilan:vBilan,admin:vAdmin})[tab](m);if(warn)m.insertAdjacentHTML("afterbegin",`<div class="c er">${esc(warn)}</div>`);stat()}
function go(t){tab=t;if(t!="admin")adm=0;err="";render()}
function setCfg(){const u=$("#u").value.trim().replace(/\/+$/,""),k=$("#k").value.replace(/\s+/g,"");if(!/^https:\/\/.+/.test(u)||k.length<20){err="URL ou clé invalide.";return render()}cfg={url:u,key:k};LS.s("cc2_cfg",cfg);err="";render()}
async function login(){try{await auth({email:$("#e").value.trim(),password:$("#w").value},"password");err="";render();sync()}catch(e){err=e.message;render()}}
function resetCfg(){cfg=null;LS.s("cc2_cfg",null);err="";render()}
function logout(){ses=null;LS.s("cc2_ses",null);render()}
function vCaisse(m){IT={};const ds=live("dish",today()).map(d=>({id:d.id,n:d.data.n,p:d.data.p,k:"d"})),bs=drinks().map((x,i)=>({id:"b"+i,n:x[0],p:x[1],k:"b"}));[...ds,...bs].forEach(i=>IT[i.id]=i);Object.keys(cart).forEach(k=>{if(!IT[k])delete cart[k]});
const btn=i=>`<button class="it" onclick="addC('${i.id}')">${esc(i.n)}<span>${fmt(i.p)}</span></button>`,L=Object.keys(cart),T=L.reduce((a,k)=>a+IT[k].p*cart[k],0);
m.innerHTML=`<div class="c"><h2>Vendeur du jour</h2><select onchange="seller=this.value;LS.s('cc2_sel',seller)"><option value="">— Choisir —</option>${sellers().map(s=>`<option ${s==seller?"selected":""}>${esc(s)}</option>`).join("")}</select></div>
<div class="c"><h2>Panier</h2>${L.length?L.map(k=>`<div class="r"><span>${esc(IT[k].n)}<br><span class="mu">${fmt(IT[k].p)}</span></span><span><button class="s" onclick="addC('${k}',-1)">−</button> <b>${cart[k]}</b> <button class="s" onclick="addC('${k}',1)">+</button></span></div>`).join(""):'<p class="mu">Touchez un article pour l’ajouter.</p>'}
<div class="r"><b>Total</b><span class="big">${fmt(T)}</span></div><div class="p"><button class="s ${pay=="Espèces"?"on":""}" onclick="pay='Espèces';render()">Espèces</button><button class="s ${pay=="Mobile Money"?"on":""}" onclick="pay='Mobile Money';render()">Mobile Money</button></div>${pay=="Mobile Money"?'<input id="ref" placeholder="Référence de la transaction (facultatif)">':""}<button class="b" onclick="valid()">Valider la vente</button><p class="er">${esc(err)}</p></div>
${ds.length?`<div class="c"><h2>Plats du jour</h2><div class="g">${ds.map(btn).join("")}</div></div>`:""}<div class="c"><h2>Boissons</h2><div class="g">${bs.map(btn).join("")}</div></div>`}
function addC(k,d=1){cart[k]=(cart[k]||0)+d;if(cart[k]<=0)delete cart[k];err="";render()}
function valid(){const L=Object.keys(cart);if(!L.length){err="Le panier est vide.";return render()}if(!seller||!sellers().includes(seller)){err=sellers().length?"Choisissez le vendeur du jour.":"Aucun vendeur enregistré : l’administrateur doit les ajouter (onglet Admin).";return render()}
const i=L.map(k=>({n:IT[k].n,p:IT[k].p,q:cart[k],k:IT[k].k})),t=i.reduce((a,l)=>a+l.p*l.q,0),r=$("#ref")?$("#ref").value.trim():"";add("sale",{i,t,m:pay,r,v:seller});cart={};err="";render()}
function rm(id){add("void",{t:id,by:seller||"?"});render()}
function vPlats(m){const d=live("dish",today());m.innerHTML=`<div class="c"><h2>Ajouter un plat du jour</h2><input id="n" placeholder="Nom du plat"><input id="p" type="number" inputmode="numeric" placeholder="Prix (FCFA)"><button class="b" onclick="addD()">Ajouter</button><p class="er">${esc(err)}</p></div><div class="c"><h2>Plats d’aujourd’hui</h2>${d.length?d.map(x=>`<div class="r"><span>${esc(x.data.n)} · <b>${fmt(x.data.p)}</b></span><button class="s" onclick="rm('${x.id}')">Retirer</button></div>`).join(""):'<p class="mu">Aucun plat ajouté aujourd’hui.</p>'}</div>`}
function addD(){const n=$("#n").value.trim(),p=+$("#p").value;if(!n||!(p>0)){err="Indiquez un nom et un prix.";return render()}add("dish",{n,p});err="";render()}
function vDep(m){const d=live("expense",today());m.innerHTML=`<div class="c"><h2>Enregistrer une dépense</h2><input id="l" placeholder="Motif (viande, charbon, transport…)"><input id="a" type="number" inputmode="numeric" placeholder="Montant (FCFA)"><button class="b" onclick="addE()">Enregistrer</button><p class="er">${esc(err)}</p></div><div class="c"><h2>Dépenses d’aujourd’hui</h2>${d.length?d.map(x=>`<div class="r"><span>${esc(x.data.l)} · <b>${fmt(x.data.a)}</b></span><button class="s" onclick="rm('${x.id}')">Annuler</button></div>`).join(""):'<p class="mu">Aucune dépense aujourd’hui.</p>'}</div>`}
function addE(){const l=$("#l").value.trim(),a=+$("#a").value;if(!l||!(a>0)){err="Indiquez un motif et un montant.";return render()}add("expense",{l,a,v:seller});err="";render()}
function cancel(id){const w=prompt("Motif de l’annulation (facultatif) :");if(w===null)return;add("void",{t:id,w:w.trim(),by:seller||"?"});render()}
function vBilan(m){day=day||today();const t=tot(day),VO=new Map(ev.filter(e=>e.type=="void").map(e=>[e.data.t,e.data])),s=sales(day).slice().reverse(),days=[...new Set(ev.filter(e=>e.type=="sale"||e.type=="expense").map(e=>e.day))].sort().reverse().slice(0,10);
m.innerHTML=`<div class="c"><h2>Jour</h2><input type="date" value="${day}" onchange="day=this.value||today();render()"></div>
${adm?`<div class="c"><h2>Bilan du jour</h2><div class="r"><span>Boissons vendues</span><b>${fmt(t.b)}</b></div><div class="r"><span>Plats vendus</span><b>${fmt(t.p)}</b></div><div class="r"><span>Espèces</span><b>${fmt(t.es)}</b></div><div class="r"><span>Mobile Money</span><b>${fmt(t.mm)}</b></div><div class="r"><span>Total encaissé (${t.n} ventes)</span><b>${fmt(t.rec)}</b></div><div class="r"><span>Dépenses</span><b>${fmt(t.dp)}</b></div><div class="r"><b>Solde après dépenses</b><span class="big">${fmt(t.sol)}</span></div></div>
<div class="c"><h2>Par vendeur</h2>${Object.entries(t.V).map(([k,v])=>`<div class="r"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join("")||'<p class="mu">Aucune vente.</p>'}</div>`:'<div class="c"><p class="mu">Les totaux sont réservés à l’administrateur (onglet Admin, puis revenez ici).</p></div>'}
<div class="c"><h2>Ventes</h2>${s.length?s.map(x=>{const o=VO.get(x.id);return`<div class="r ${o?"x":""}"><span>${new Date(x.at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})} · ${x.data.i.map(l=>l.q+"× "+esc(l.n)).join(", ")}<br><span class="mu">${esc(x.data.v||"?")} · ${x.data.m}${x.data.r?" · "+esc(x.data.r):""}${o?" · annulée par "+esc(o.by)+(o.w?" : "+esc(o.w):""):""}</span></span><span><b>${fmt(x.data.t)}</b>${o||(!adm&&x.day!=today())?"":` <button class="s" onclick="cancel('${x.id}')">Annuler</button>`}</span></div>`}).join(""):'<p class="mu">Aucune vente ce jour.</p>'}</div>
${adm?`<div class="c"><h2>Derniers jours</h2>${days.map(d=>{const z=tot(d);return`<div class="r"><span>${d}</span><span>${fmt(z.rec)} − ${fmt(z.dp)} = <b>${fmt(z.sol)}</b></span></div>`}).join("")||'<p class="mu">Pas encore d’historique.</p>'}</div>`:""}
<div class="c"><button class="s" onclick="sync()">Synchroniser maintenant</button> <button class="s" onclick="logout()">Déconnecter l’appareil</button></div>`}
async function H(p){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("cc"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function setPin(){const p=$("#pn").value.trim();if(p.length<4){err="Le code doit contenir au moins 4 caractères.";return render()}const was=adm;add("pin",{h:await H(p)});adm=1;err="";render();if(was)alert("Code modifié.")}
async function unlock(){if(await H($("#pn").value.trim())==pinH()){adm=1;err=""}else err="Code incorrect.";render()}
function vAdmin(m){const k=pinH();if(!adm){m.innerHTML=`<div class="c"><h2>${k?"Code administrateur":"Créer le code administrateur"}</h2><input id="pn" type="password" inputmode="numeric" placeholder="${k?"Code":"Choisissez un code (4 caractères minimum)"}"><button class="b" onclick="${k?"unlock()":"setPin()"}">${k?"Déverrouiller":"Enregistrer le code"}</button><p class="er">${esc(err)}</p></div>`;return}
m.innerHTML=`<div class="c"><h2>Boissons</h2><p class="mu">Une boisson par ligne, au format Nom;Prix. Les ventes déjà faites gardent leur ancien prix.</p><textarea id="dl" rows="14">${esc(drinks().map(x=>x[0]+";"+x[1]).join("\n"))}</textarea><button class="b" onclick="saveD()">Enregistrer les boissons</button></div>
<div class="c"><h2>Vendeurs</h2><p class="mu">Un nom par ligne.</p><textarea id="sl" rows="5">${esc(sellers().join("\n"))}</textarea><button class="b" onclick="saveS()">Enregistrer les vendeurs</button></div>
<div class="c"><h2>Code administrateur</h2><input id="pn" type="password" inputmode="numeric" placeholder="Nouveau code"><button class="b" onclick="setPin()">Changer le code</button><button class="s" style="margin-top:8px;width:100%" onclick="adm=0;render()">Verrouiller</button><p class="er">${esc(err)}</p></div>`}
function saveD(){const l=$("#dl").value.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>{const i=x.lastIndexOf(";");if(i<1)return["",0];return[x.slice(0,i).trim(),+x.slice(i+1).replace(/\s/g,"")]});if(!l.length||l.some(x=>!x[0]||!(x[1]>0)))return alert("Chaque ligne doit avoir le format Nom;Prix, avec un prix supérieur à 0.");add("menu",{l});cart={};alert("Liste des boissons enregistrée.");render()}
function saveS(){const l=[...new Set($("#sl").value.split("\n").map(x=>x.trim()).filter(Boolean))];add("sellers",{l});if(!l.includes(seller)){seller="";LS.s("cc2_sel","")}alert("Vendeurs enregistrés.");render()}
addEventListener("online",sync);addEventListener("offline",stat);setInterval(sync,60000);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();sync();
</script></body></html>
